<h1>All Orders</h1>

<table border="1">
<tr>
    <th>Name</th>
    <th>Product</th>
    <th>Quantity</th>
    <th>Price</th>
</tr>

{% for order in orders %}
<tr>
    <td>{{ order.name }}</td>
    <td>{{ order.product.name }}</td>
    <td>{{ order.quantity }}</td>
    <td>{{ order.price }}</td>
</tr>
{% endfor %}

</table>
