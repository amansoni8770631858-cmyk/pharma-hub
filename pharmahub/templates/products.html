<!DOCTYPE html>
<html>
<head>

<title>PharmaHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container">

<h1 class="text-center mt-4">PharmaHub Store</h1>

<div class="row">

{% for product in products %}

<div class="col-md-4 mt-4">

<div class="card">

<img src="{{ product.image.url }}" class="card-img-top" height="200">

<div class="card-body">

<h5 class="card-title">{{ product.name }}</h5>

<p>Price: ₹{{ product.price }}</p>

<p>{{ product.description }}</p>

<p>Stock: {{ product.stock }}</p>

<a href="/add-to-cart/{{ product.id }}/" class="btn btn-primary">
Add to Cart
</a>

</div>

</div>

</div>

{% endfor %}

</div>

</div>

</body>
</html>

<nav class="navbar navbar-dark bg-dark">
<div class="container">

<a class="navbar-brand" href="/">PharmaHub</a>

<form class="d-flex" method="GET" action="/">
<input class="form-control me-2" type="search" placeholder="Search medicine" name="q">

<button class="btn btn-success" type="submit">Search</button>
</form>

<a href="/cart/" class="btn btn-light">Cart</a>

</div>
</nav>
